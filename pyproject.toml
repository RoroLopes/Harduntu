[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harduntu"
version = "0.1.0"
description = "Interactive CLI tool for Linux system hardening based on CIS Benchmarks"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]


[project.scripts]
harduntu = "Harduntu.cli:main"